name: Build and deploy Sync Pairs Tracker

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this integration repository
        uses: actions/checkout@v4

      - name: Clone upstream Sync Pairs Tracker
        run: |
          git clone --depth 1 https://github.com/pomasters/SyncPairsTracker.git upstream

      - name: Build customized site
        run: |
          python3 scripts/build_site.py upstream build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
